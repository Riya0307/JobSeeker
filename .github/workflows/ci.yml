name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-key-for-testing-only
      DJANGO_DEBUG: "False"
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: jobseeker_test
      DB_USER: jobseeker
      DB_PASSWORD: jobseeker
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      REDIS_URL: redis://127.0.0.1:6379/0
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and start MySQL and Redis
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server redis-server default-libmysqlclient-dev pkg-config
          sudo systemctl start mysql
          sudo systemctl start redis-server
          sudo mysql --execute="CREATE DATABASE jobseeker_test CHARACTER SET utf8mb4; CREATE USER 'jobseeker'@'localhost' IDENTIFIED BY 'jobseeker'; GRANT ALL PRIVILEGES ON jobseeker_test.* TO 'jobseeker'@'localhost'; FLUSH PRIVILEGES;"
          mysqladmin ping --host=127.0.0.1 --user=jobseeker --password=jobseeker
          redis-cli ping

      - name: Install Python dependencies
        run: pip install -r requirements/development.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
